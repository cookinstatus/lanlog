name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tool is stdlib-only by design, so there is nothing to install.
      # test_tray_panel.py is skipped here: it imports PyGObject/GTK and D-Bus,
      # which are system packages and need a desktop session.
      - name: Run the test suite
        run: |
          set -e
          for t in tests/test_blocking.py tests/test_keys.py tests/test_labels.py tests/test_layout.py; do
            echo "=== $t"
            python3 "$t"
          done
      - name: Byte-compile everything
        run: python3 -m compileall -q lanlog lan-logger.py bin/lanlog
